name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Binary smoke
        run: |
          ./dist/lgcy --version | grep -qx "lgcy 0.1.0"
          ./dist/lgcy --help | grep -q "LGCY_BASE_URL"
